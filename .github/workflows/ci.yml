name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker compose smoke test
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tạo .env cho CI
        run: echo "SITE_URL=http://localhost:3000" > .env
      - name: Build và khởi động
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: bash scripts/smoke-test.sh http://localhost:3000
      - if: failure()
        name: Log dịch vụ
        run: docker compose logs --no-color
      - if: always()
        name: Dọn dẹp
        run: docker compose down -v
