name: CI

# Web ở chế độ cá nhân (docs/LOCAL_MODE.md): không có backend/CSDL nên không có job backend.
# Mã của phần server được giữ nguyên dưới dạng comment (đánh dấu `[máy chủ — đang tắt]`).

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # [máy chủ — đang tắt] backend:
  # [máy chủ — đang tắt]   name: Backend (unit + integration)
  # [máy chủ — đang tắt]   runs-on: ubuntu-latest
  # [máy chủ — đang tắt]   defaults:
  # [máy chủ — đang tắt]     run:
  # [máy chủ — đang tắt]       working-directory: backend
  # [máy chủ — đang tắt]   steps:
  # [máy chủ — đang tắt]     - uses: actions/checkout@v7
  # [máy chủ — đang tắt]     - uses: actions/setup-java@v6
  # [máy chủ — đang tắt]       with:
  # [máy chủ — đang tắt]         distribution: temurin
  # [máy chủ — đang tắt]         java-version: "17"
  # [máy chủ — đang tắt]         cache: maven
  # [máy chủ — đang tắt]         cache-dependency-path: backend/pom.xml
  # [máy chủ — đang tắt]     # Runner có Docker nên integration test (Testcontainers + PostgreSQL 16) chạy thật, không bị bỏ qua.
  # [máy chủ — đang tắt]     - run: mvn -B verify
  # [máy chủ — đang tắt]     - if: failure()
  # [máy chủ — đang tắt]       uses: actions/upload-artifact@v7
  # [máy chủ — đang tắt]       with:
  # [máy chủ — đang tắt]         name: surefire-reports
  # [máy chủ — đang tắt]         path: backend/target/surefire-reports/

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker (web) smoke test
    # [máy chủ — đang tắt] needs: [backend, web]
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tạo .env cho CI
        run: |
          {
            echo "SITE_URL=http://localhost:3000"
            # [máy chủ — đang tắt] echo "DB_PASSWORD=$(openssl rand -hex 16)"
            # [máy chủ — đang tắt] echo "JWT_SECRET=$(openssl rand -base64 48)"
            # [máy chủ — đang tắt] echo "GOOGLE_CLIENT_ID=ci-placeholder.apps.googleusercontent.com"
          } > .env
      - name: Build và khởi động
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: bash scripts/smoke-test.sh http://localhost:3000
      - if: failure()
        name: Log dịch vụ
        run: docker compose logs --no-color
      - if: always()
        name: Dọn dẹp
        run: docker compose down -v
