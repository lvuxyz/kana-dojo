name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Runner có Docker nên integration test (Testcontainers + PostgreSQL 16) chạy thật, không bị bỏ qua.
      - run: mvn -B verify
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker compose smoke test
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tạo .env cho CI
        run: |
          {
            echo "SITE_URL=http://localhost:3000"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48)"
            echo "GOOGLE_CLIENT_ID=ci-placeholder.apps.googleusercontent.com"
          } > .env
      - name: Build và khởi động
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: bash scripts/smoke-test.sh http://localhost:3000
      - if: failure()
        name: Log dịch vụ
        run: docker compose logs --no-color
      - if: always()
        name: Dọn dẹp
        run: docker compose down -v
