# Phục vụ bản xuất bản tĩnh của Next.js (thư mục out/). Không proxy, không upstream: mọi thứ là tệp tĩnh.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 512;

    # Header an toàn. HSTS để bên đầu cuối TLS (Nginx/CDN phía trước) đặt, vì container này chỉ nói HTTP.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Next xuất /luyen-viet thành luyen-viet.html, /quiz/1 thành quiz/1.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
        # HTML luôn xin lại máy chủ (304 nếu không đổi) để bản deploy mới có hiệu lực ngay.
        expires -1;
    }

    # Manifest PWA. default_type chỉ phòng khi mime.types của bản Nginx này chưa có đuôi .webmanifest.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    # sw.js KHÔNG được cache lâu: trình duyệt cần thấy bản mới ngay sau mỗi lần deploy để cập nhật cache offline.
    # (Đã nằm dưới `location /` với expires -1; khai báo riêng để ý đồ không bị vô tình sửa mất.)
    location = /sw.js {
        expires -1;
    }

    # Tên tệp trong _next/static chứa mã băm nội dung nên cache vô thời hạn là an toàn.
    location /_next/static/ {
        expires 1y;
        access_log off;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
