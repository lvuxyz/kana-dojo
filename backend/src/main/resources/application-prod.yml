# Profile prod: mọi bí mật đến từ biến môi trường, không có giá trị mặc định.
# Thiếu bất kỳ biến nào -> ứng dụng dừng ngay khi khởi động (fail fast).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: kana-dojo
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  google:
    client-id: ${GOOGLE_CLIENT_ID}

logging:
  level:
    root: INFO
    com.japanese.learning: INFO
