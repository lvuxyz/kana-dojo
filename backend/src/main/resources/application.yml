server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: kana-dojo-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kanadojo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: kanadojo-pool
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      # Flyway là nguồn sự thật của lược đồ; Hibernate chỉ được phép kiểm tra.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  threads:
    virtual:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

app:
  # Khoá HS256 mặc định chỉ dành cho môi trường dev cục bộ; profile prod bắt buộc JWT_SECRET.
  jwt:
    secret: ${JWT_SECRET:kana-dojo-local-development-secret-key-do-not-use-in-production}
    issuer: kana-dojo
    access-token-ttl: 15m
    refresh-token-ttl: 30d
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  srs:
    new-cards-per-day: 10
    desired-retention: 0.90
  gamification:
    max-streak-freezes: 2
    zone: Asia/Ho_Chi_Minh
  rate-limit:
    auth-requests-per-minute: 10

logging:
  level:
    com.japanese.learning: DEBUG
    org.hibernate.SQL: INFO
