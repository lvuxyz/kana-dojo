# Kana Dōjō — một container Nginx phục vụ bản xuất bản tĩnh. Không cơ sở dữ liệu, không backend.
#   cp .env.example .env    # chỉ cần SITE_URL
#   docker compose up -d --build --wait
# Đặt Nginx/CDN (TLS) phía trước cổng web khi chạy thật — xem docs/DEPLOYMENT.md.
# Không cần Docker cũng được: `npm run build` trong web/ rồi đặt thư mục out/ lên bất kỳ máy chủ tĩnh nào.

name: kana-dojo

services:
  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:?Đặt SITE_URL trong .env}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "${WEB_PORT:-3000}:8080"
